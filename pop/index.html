
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        p {
            font-size: 16px;
            color: #333;
            margin-bottom: 25px;
        }

        .watch-button {
            display: inline-block;
            padding: 15px 40px;
            background-color: #000;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .watch-button:hover {
            background-color: #333;
        }
    </style>
  <script data-cfasync="false" async type="text/javascript" src="//yz.rashfulexplees.com/reIdBPiP3WWP0/161443"></script>
</head>

<body>

    <div class="container">
        <p>Press the button below to watch the video.</p>

        <a href="YOUR_VIDEO_LINK_HERE" class="watch-button">
            WATCH VIDEO
        </a>
    </div>

</body>
</html>
